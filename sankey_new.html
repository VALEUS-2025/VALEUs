function normalizeToken(s){
  if (s == null) return "";
  return String(s).trim().replace(/\s+/g, " ");
}
function splitMulti(value){
  const v = normalizeToken(value);
  if (!v) return [];
  return v.split(",").map(x => normalizeToken(x)).filter(Boolean);
}

function normalizeDomain(d){
  d = normalizeToken(d);
  return DOMAIN_ALIASES[d.toLowerCase()] || d;
}

function normalizeKind(k){
  k = normalizeToken(k);
  const key = k
    .toLowerCase()
    .replace(/[-_]+/g, " ")
    .replace(/\s*\/\s*/g, "/")
    .replace(/\s+/g, " ")
    .trim();
  return KIND_ALIASES[key] || k;
}

function hexToRgb(hex){
  const h = hex.replace("#", "").trim();
  const full = (h.length === 3) ? h.split("").map(c => c+c).join("") : h;
  const int = parseInt(full, 16);
  return { r:(int>>16)&255, g:(int>>8)&255, b:int&255 };
}
function lightenHex(hex, amount=0.45){
  const {r,g,b} = hexToRgb(hex);
  const nr = Math.round(r + (255 - r) * amount);
  const ng = Math.round(g + (255 - g) * amount);
  const nb = Math.round(b + (255 - b) * amount);
  return `rgb(${nr},${ng},${nb})`;
}
function rgbaFromHex(hex, a=0.35){
  const {r,g,b} = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}

function setStatus(msg){

/**
 * Org color = action-domain of the *first submission row* for that org (file order).
 * This stays stable even when filters change.
 */
function buildOrgColorMap(allRows){
  // 1) Collect per-org domain counts + first-seen index for tie-breaking
  const orgDomains = new Map(); // org -> Map(domain -> {count, firstIdx})
  const orgFirstIdx = new Map(); // org -> first row index (for deterministic ordering)

  allRows.forEach((row, idx) => {
    const org = normalizeToken(row[COL_ORG]);
    if (!org) return;

    if (!orgFirstIdx.has(org)) orgFirstIdx.set(org, idx);

    const domains = splitMulti(row[COL_DOM]).map(normalizeDomain);

    if (!domains.length) domains.push("other");

    if (!orgDomains.has(org)) orgDomains.set(org, new Map());
    const m = orgDomains.get(org);

    for (const dRaw of domains){
      const d = CAT_COLORS[dRaw] ? dRaw : "other";
      if (!m.has(d)) m.set(d, { count: 0, firstIdx: idx });
      const obj = m.get(d);
      obj.count += 1;
      obj.firstIdx = Math.min(obj.firstIdx, idx);
    }
  });

  // 2) Assign colors trying to diversify:
  // choose, for each org, the candidate domain whose color is currently least used,
  // with fallback to the org's most frequent domain.
  const domainUse = new Map(); // domain -> assigned count
  const orgColor = new Map();
  const orgDomain = new Map();

  // Deterministic org order: first appearance in file
  const orgList = Array.from(orgDomains.keys())
    .sort((a,b) => (orgFirstIdx.get(a) - orgFirstIdx.get(b)) || a.localeCompare(b));

  for (const org of orgList){
    const domMap = orgDomains.get(org); // Map(domain -> {count, firstIdx})
    const candidates = Array.from(domMap.entries())
      .sort((a,b) => {
        // Primary: higher frequency
        if (b[1].count !== a[1].count) return b[1].count - a[1].count;
        // Secondary: earlier first occurrence
        if (a[1].firstIdx !== b[1].firstIdx) return a[1].firstIdx - b[1].firstIdx;
        // Tertiary: name
        return a[0].localeCompare(b[0]);
      })
      .map(([d]) => d);

    // pick least-used domain among the top K candidates (K can be all; here all)
    let best = candidates[0] || "other";
    let bestUse = Infinity;

    for (const d of candidates){
      const use = domainUse.get(d) || 0;
      // skip "other" if there is any non-other option
      if (d === "other" && candidates.some(x => x !== "other")) continue;

      if (use < bestUse){
        bestUse = use;
        best = d;
      }
    }

    domainUse.set(best, (domainUse.get(best) || 0) + 1);

    const col = CAT_COLORS[best] || CAT_COLORS["other"];
    orgColor.set(org, col);
    orgDomain.set(org, best);
  }

  return { orgColor, orgDomain };
}


/**
 * Addressee color = lighter shade of the org with max incoming flow.
 */
function buildAddresseeColorMap(flowOrgToAddr, orgColor){
  const addrColor = new Map();

  for (const [addr, orgMap] of flowOrgToAddr.entries()){
    let bestOrg = null;
    let bestVal = -Infinity;
    for (const [org, val] of orgMap.entries()){
      if (val > bestVal){
        bestVal = val;
        bestOrg = org;
      }
    }
    const base = orgColor.get(bestOrg) || CAT_COLORS["other"];
    addrColor.set(addr, lightenHex(base, 0.45));
  }
  return { addrColor };
}

  /** ------- Highlight ------- */
function setAlpha(color, alpha){
  if (!color) return `rgba(0,0,0,${alpha})`;
  const c = String(color).trim();

  if (c.startsWith("rgba(")){
    return c.replace(/rgba\(([^)]+)\)/, (m, inner) => {
      const parts = inner.split(",").map(s => s.trim());
      return `rgba(${parts[0]},${parts[1]},${parts[2]},${alpha})`;
    });
  }
  if (c.startsWith("rgb(")){
    return c.replace("rgb(", "rgba(").replace(")", `,${alpha})`);
  }
  if (c.startsWith("#")){
    return rgbaFromHex(c, alpha);
  }
  // fallback
  return `rgba(0,0,0,${alpha})`;
}

function focusEquals(a, b){
  return !!a && !!b && a.col === b.col && a.name === b.name;
}

function linkMatchesFocus(meta, focus){
  if (!focus || !meta) return false;
  if (focus.col === 'org') return meta.org === focus.name;
  if (focus.col === 'kind') return meta.kind === focus.name;

  if (focus.col === 'addr'){
    if (meta.addr === focus.name) return true;

    // For an addressee also highlight the upstream Org → Kind links
    // that feed into that addressee, so the complete path is visible.
    if (meta.layer === 'Org → Kind'){
      return LAST_LINK_META.some(m =>
        m.layer === 'Kind → Addressee' &&
        m.addr === focus.name &&
        m.org === meta.org &&
        m.kind === meta.kind
      );
    }
  }

  return false;
}

function applyPathHighlight(focus){
  if (!LAST_LINK_BASECOLORS.length) return;

  if (!focus){
    Plotly.restyle('chart', {
      'link.color': [LAST_LINK_BASECOLORS],
      'link.line.color': [LAST_LINK_LINE_COLORS],
      'link.line.width': [LAST_LINK_LINE_WIDTHS],
      'node.color': [LAST_NODE_BASECOLORS]
    });
    return;
  }

  const selectedLink = LAST_LINK_META.map(m => linkMatchesFocus(m, focus));
  const connectedNodes = new Set();

  selectedLink.forEach((selected, i) => {
    if (!selected) return;
    connectedNodes.add(LAST_LINK_SOURCE[i]);
    connectedNodes.add(LAST_LINK_TARGET[i]);
  });

  LAST_NODE_META.forEach((meta, i) => {
    if (meta.col === focus.col && meta.name === focus.name) connectedNodes.add(i);
  });

  const newLinkColors = LAST_LINK_BASECOLORS.map((base, i) =>
    setAlpha(base, selectedLink[i] ? 0.98 : 0.10)
  );

  const newLinkLineColors = LAST_LINK_LINE_COLORS.map((base, i) =>
    selectedLink[i] ? 'rgba(31, 41, 55, 0.78)' : 'rgba(0,0,0,0.05)'
  );

  // Plotly determines Sankey ribbon thickness from link.value. Changing
  // those values would distort the diagram. A thicker outline makes the
  // selected ribbons look wider without changing their geometry.
  const newLinkLineWidths = LAST_LINK_LINE_WIDTHS.map((base, i) =>
    selectedLink[i] ? 2.4 : 0.15
  );

  const newNodeColors = LAST_NODE_BASECOLORS.map((base, i) =>
    setAlpha(base, connectedNodes.has(i) ? 1.0 : 0.55)
  );

  Plotly.restyle('chart', {
    'link.color': [newLinkColors],
    'link.line.color': [newLinkLineColors],
    'link.line.width': [newLinkLineWidths],
    'node.color': [newNodeColors]
  });
}

/** Filter rule: keep row if its domains intersect selectedDomains. */
function rowPassesDomainFilter(row){
  const domains = splitMulti(row[COL_DOM]).map(normalizeDomain);

  // If no domains are provided, treat it as "other"
  if (!domains.length) return selectedDomains.has("other");

  // Keep row if ANY domain matches the selected set
  return domains.some(d => selectedDomains.has(d));
}


/** Render Sankey from a (possibly filtered) row set, using stable orgColor computed from full CSV. */
/* VALEUS_SANKEY_INTERACTION_HELPERS_START */
function sankeyEscapeHtml(value){
  return String(value == null ? '' : value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function sankeySafeUrl(value){
  let raw = String(value || '').trim();
  if (!raw) return '';
  if (!/^https?:\/\//i.test(raw)) raw = `https://${raw}`;
  try {
    const url = new URL(raw);
    return (url.protocol === 'http:' || url.protocol === 'https:') ? url.href : '';
  } catch (_) {
    return '';
  }
}

function asArray(value){
  if (Array.isArray(value)) return value;
  if (value == null || value === '') return [];
  return [value];
}

function alphaSort(values){
  return Array.from(new Set(asArray(values).filter(Boolean)))
    .sort((a,b) => String(a).localeCompare(String(b)));
}

function panelRow(label, values){
  const arr = Array.isArray(values) ? alphaSort(values) : [values].filter(Boolean);
  if (!arr.length) return '';
  return `<div class="si-row"><div class="si-label">${sankeyEscapeHtml(label)}</div>` +
    `<div class="si-value">${arr.map(v => `<div class="si-line">${sankeyEscapeHtml(v)}</div>`).join('')}</div></div>`;
}

function currentRowsForFocus(focus){
  if (!focus) return [];
  return LAST_VISIBLE_ROWS.filter(row => {
    const org = normalizeToken(row[COL_ORG]);
    const kinds = Array.from(new Set(splitMulti(row[COL_KIND]).map(normalizeKind)));
    const addrs = splitMulti(row[COL_ADDR]);
    if (focus.col === 'org') return org === focus.name;
    if (focus.col === 'kind') return kinds.includes(focus.name);
    if (focus.col === 'addr') return addrs.includes(focus.name);
    return false;
  });
}

function buildOrgPanel(focus){
  const rows = currentRowsForFocus(focus);
  const detail = SANKEY_DETAILS[focus.name] || {};
  const visibleProjects = new Set(rows.map(r => normalizeToken(r['Name of the Project/Action'])).filter(Boolean));
  let projects = Array.isArray(detail.projects) ? detail.projects : [];
  if (visibleProjects.size) projects = projects.filter(p => visibleProjects.has(p.name));

  // If no rich Tally metadata exists for a visible project, still build
  // its structural information from the normalized Sankey CSV.
  const rowProjectMap = new Map();
  rows.forEach(r => {
    const name = normalizeToken(r['Name of the Project/Action']);
    if (!name) return;
    if (!rowProjectMap.has(name)) {
      rowProjectMap.set(name, {
        name,
        description: '',
        countries: [],
        actionDomains: [],
        kindsOfAction: [],
        addressees: []
      });
    }
    const p = rowProjectMap.get(name);
    p.countries.push(...splitMulti(r['Countries of Engagement (up to 5 country)']));
    p.actionDomains.push(...splitMulti(r[COL_DOM]).map(normalizeDomain));
    p.kindsOfAction.push(...splitMulti(r[COL_KIND]).map(normalizeKind));
    p.addressees.push(...splitMulti(r[COL_ADDR]));
  });

  const richNames = new Set(projects.map(p => p.name));
  for (const [name, fallback] of rowProjectMap.entries()){
    fallback.countries = alphaSort(fallback.countries);
    fallback.actionDomains = alphaSort(fallback.actionDomains);
    fallback.kindsOfAction = alphaSort(fallback.kindsOfAction);
    fallback.addressees = alphaSort(fallback.addressees);
    if (!richNames.has(name)) projects.push(fallback);
  }
  projects.sort((a,b) => String(a.name || '').localeCompare(String(b.name || '')));

  const firstRow = rows[0] || {};
  const fallbackHeadquarters = [
    normalizeToken(firstRow['City in which the organisation/headquarters is based']),
    normalizeToken(firstRow['Country in which the organisation/headquarter is based'])
  ].filter(Boolean).join(', ');

  const href = sankeySafeUrl(detail.website || '');
  const websiteHtml = detail.website
    ? (href ? `<a href="${sankeyEscapeHtml(href)}" target="_blank" rel="noopener noreferrer">${sankeyEscapeHtml(detail.website)}</a>` : sankeyEscapeHtml(detail.website))
    : '<em>Not specified</em>';

  const projectsHtml = projects.length ? projects.map(p => {
    const description = p.description
      ? `<div class="si-project-description"><strong>Description:</strong> ${sankeyEscapeHtml(p.description)}</div>`
      : '';
    const countries = asArray(p.countries).length
      ? `<div class="si-line"><strong>Countries of engagement:</strong> ${sankeyEscapeHtml(alphaSort(p.countries).join(', '))}</div>` : '';
    const domains = asArray(p.actionDomains).length
      ? `<div class="si-line"><strong>Action domain:</strong> ${sankeyEscapeHtml(alphaSort(p.actionDomains).join(', '))}</div>` : '';
    const kinds = asArray(p.kindsOfAction).length
      ? `<div class="si-line"><strong>Kind of action:</strong> ${sankeyEscapeHtml(alphaSort(p.kindsOfAction).join(', '))}</div>` : '';
    const addrs = asArray(p.addressees).length
      ? `<div class="si-line"><strong>Addressees:</strong> ${sankeyEscapeHtml(alphaSort(p.addressees).join(', '))}</div>` : '';

    return `<div class="si-project"><div class="si-project-title">${sankeyEscapeHtml(p.name || 'Untitled project')}</div>` +
      `${description}${countries}${domains}${kinds}${addrs}</div>`;
  }).join('') : '<div class="si-value"><em>No project information is available for this organisation.</em></div>';

  return `
    <div class="si-type">Organization</div>
    <div class="si-title">${sankeyEscapeHtml(focus.name)}</div>
    <div class="si-row"><div class="si-label">Description</div><div class="si-value">
      <div class="si-line"><strong>Type:</strong> ${detail.type ? sankeyEscapeHtml(detail.type) : '<em>Not specified</em>'}</div>
      <div class="si-line"><strong>Headquarters:</strong> ${(detail.headquarters || fallbackHeadquarters) ? sankeyEscapeHtml(detail.headquarters || fallbackHeadquarters) : '<em>Not specified</em>'}</div>
      <div class="si-line"><strong>Website:</strong> ${websiteHtml}</div>
    </div></div>
    <div class="si-row"><div class="si-label">Projects</div><div class="si-value">${projectsHtml}</div></div>`;
}

function buildRelationalPanel(focus){
  const rows = currentRowsForFocus(focus);
  const orgs = alphaSort(rows.map(r => normalizeToken(r[COL_ORG])));
  const projects = alphaSort(rows.map(r => normalizeToken(r['Name of the Project/Action'])));
  const domains = alphaSort(rows.flatMap(r => splitMulti(r[COL_DOM]).map(normalizeDomain)));
  const countries = alphaSort(rows.flatMap(r => splitMulti(r['Countries of Engagement (up to 5 country)'])));
  const kinds = alphaSort(rows.flatMap(r => splitMulti(r[COL_KIND]).map(normalizeKind)));
  const addrs = alphaSort(rows.flatMap(r => splitMulti(r[COL_ADDR])));

  const typeLabel = focus.col === 'kind' ? 'Kind of Action' : 'Addressee';
  let html = `<div class="si-type">${typeLabel}</div><div class="si-title">${sankeyEscapeHtml(focus.name)}</div>`;
  html += panelRow('Organizations', orgs);
  html += panelRow('Projects', projects);
  html += panelRow('Countries of engagement', countries);
  html += panelRow('Action domains', domains);
  if (focus.col === 'addr') html += panelRow('Kinds of action', kinds);
  if (focus.col === 'kind') html += panelRow('Addressees', addrs);
  return html;
}

function positionSankeyPanel(event){
  const panel = document.getElementById('sankeyInfoPanel');
  if (!panel) return;
  const margin = 14;
  const width = panel.offsetWidth || 360;
  const height = panel.offsetHeight || 300;
  let x = event && Number.isFinite(event.clientX) ? event.clientX + 18 : window.innerWidth - width - margin;
  let y = event && Number.isFinite(event.clientY) ? event.clientY + 18 : margin;
  if (x + width + margin > window.innerWidth) x = Math.max(margin, (event?.clientX || window.innerWidth) - width - 18);
  if (y + height + margin > window.innerHeight) y = Math.max(margin, window.innerHeight - height - margin);
  panel.style.left = `${x}px`;
  panel.style.top = `${y}px`;
}

function showSankeyPanel(focus, event){
  const panel = document.getElementById('sankeyInfoPanel');
  const content = document.getElementById('sankeyInfoContent');
  if (!panel || !content || !focus) return;
  content.innerHTML = focus.col === 'org' ? buildOrgPanel(focus) : buildRelationalPanel(focus);
  panel.classList.add('visible');
  requestAnimationFrame(() => positionSankeyPanel(event));
}

function hideSankeyPanel(){
  const panel = document.getElementById('sankeyInfoPanel');
  if (panel) panel.classList.remove('visible');
}

function nodeFocusFromPoint(pt, orgList, kindList, addrList){
  if (!pt) return null;

  // Plotly exposes node.customdata directly on current Sankey builds.
  // Prefer this because it is more robust than internal pointData flags.
  if (pt.customdata && pt.customdata.col && pt.customdata.name){
    return { col: pt.customdata.col, name: pt.customdata.name };
  }

  if (!(pt.pointData && pt.pointData.node)) return null;
  const i = pt.pointNumber;
  if (i < orgList.length) return { col: 'org', name: orgList[i] };
  if (i < orgList.length + kindList.length) return { col: 'kind', name: kindList[i - orgList.length] };
  const ai = i - orgList.length - kindList.length;
  if (ai >= 0 && ai < addrList.length) return { col: 'addr', name: addrList[ai] };
  return null;
}

function installSankeyInteractions(chart, orgList, kindList, addrList){
  // Deliberately CLICK-ONLY. Restyling a Plotly Sankey on every hover
  // makes the ribbons redraw continuously and can produce a visible twitch.
  chart.removeAllListeners?.('plotly_click');
  chart.removeAllListeners?.('plotly_hover');
  chart.removeAllListeners?.('plotly_unhover');

  chart.on('plotly_click', ev => {
    const focus = nodeFocusFromPoint(ev?.points?.[0], orgList, kindList, addrList);
    if (!focus) return;

    // Clicking the already selected node clears the persistent selection.
    if (focusEquals(PINNED_FOCUS, focus)){
      PINNED_FOCUS = null;
      SELECTED_ORG = null;
      applyPathHighlight(null);
      hideSankeyPanel();
      return;
    }

    PINNED_FOCUS = focus;
    SELECTED_ORG = focus.col === 'org' ? focus.name : null;
    applyPathHighlight(PINNED_FOCUS);
    showSankeyPanel(PINNED_FOCUS, ev?.event);
  });

  const close = document.getElementById('sankeyInfoClose');
  if (close){
    close.onclick = () => {
      PINNED_FOCUS = null;
      SELECTED_ORG = null;
      applyPathHighlight(null);
      hideSankeyPanel();
    };
  }
}
/* VALEUS_SANKEY_INTERACTION_HELPERS_END */

function renderSankey(rows, orgColor){
  LAST_VISIBLE_ROWS = rows.slice();
  // Flows
  const flowOrgKind = new Map();        // org||kind => count
  const flowOrgKindAddr = new Map();    // org||kind||addr => count (org-specific)
  const flowOrgToAddr = new Map();      // addr => Map(org => total) for addressee shading

  const orgs = new Set();
  const kinds = new Set();
  const addrs = new Set();

  for (const row of rows){
    const org = normalizeToken(row[COL_ORG]);
    if (!org) continue;

    const kindTokens = Array.from(new Set(
      splitMulti(row[COL_KIND]).map(normalizeKind)
    ));
    const addrTokens = splitMulti(row[COL_ADDR]);

    if (!kindTokens.length || !addrTokens.length) continue;

    // domain filter already applied in rerender (rows already filtered)
    orgs.add(org);
    kindTokens.forEach(k => kinds.add(k));
    addrTokens.forEach(a => addrs.add(a));

    // Org -> Kind
    for (const k of kindTokens){
      const key = `${org}||${k}`;
      flowOrgKind.set(key, (flowOrgKind.get(key) || 0) + 1);
    }

    // Org -> Kind -> Addressee (org-specific attribution)
    for (const k of kindTokens){
      for (const a of addrTokens){
        const key = `${org}||${k}||${a}`;
        flowOrgKindAddr.set(key, (flowOrgKindAddr.get(key) || 0) + 1);

        if (!flowOrgToAddr.has(a)) flowOrgToAddr.set(a, new Map());
        const m = flowOrgToAddr.get(a);
        m.set(org, (m.get(org) || 0) + 1);
      }
    }
  }

  const { addrColor } = buildAddresseeColorMap(flowOrgToAddr, orgColor);

  const orgList  = Array.from(orgs).sort((a,b) => a.localeCompare(b));
  const kindList = Array.from(kinds).sort((a,b) => a.localeCompare(b));
  const addrList = Array.from(addrs).sort((a,b) => a.localeCompare(b));

  const labels = [...orgList, ...kindList, ...addrList];

  // Node colors
  const nodeColor = [];
  for (const o of orgList) nodeColor.push(orgColor.get(o) || CAT_COLORS["other"]);
  for (const k of kindList) nodeColor.push(KIND_GRAY);
  for (const a of addrList) nodeColor.push(addrColor.get(a) || lightenHex(CAT_COLORS["other"], 0.55));

  // Index maps
  const orgIdx  = new Map(orgList.map((o,i)=>[o,i]));
  const kindIdx = new Map(kindList.map((k,i)=>[k, orgList.length + i]));
  const addrIdx = new Map(addrList.map((a,i)=>[a, orgList.length + kindList.length + i]));

  // Links
  const source = [];
  const target = [];
  const value  = [];
  const linkColor = [];
  const linkOrg = [];  // org attribution per link
  const linkMeta = []; // hover data

  // Org -> Kind links (org-colored)
  for (const [key, v] of flowOrgKind.entries()){
    const [o,k] = key.split("||");
    if (!orgIdx.has(o) || !kindIdx.has(k)) continue;

    source.push(orgIdx.get(o));
    target.push(kindIdx.get(k));
    value.push(v);

    const baseHex = orgColor.get(o) || CAT_COLORS["other"];
    const base = rgbaFromHex(baseHex, LINK_ALPHA);
    linkColor.push(base);

    linkOrg.push(o);
    linkMeta.push({ org: o, kind: k, addr: "", val: v, layer: "Org → Kind" });
  }

  // Kind -> Addressee links (org-specific, so highlight works)
  for (const [key, v] of flowOrgKindAddr.entries()){
    const [o,k,a] = key.split("||");
    if (!kindIdx.has(k) || !addrIdx.has(a)) continue;

    source.push(kindIdx.get(k));
    target.push(addrIdx.get(a));
    value.push(v);

    // color by org (consistent attribution)
    const baseHex = orgColor.get(o) || CAT_COLORS["other"];
    const base = rgbaFromHex(baseHex, LINK_ALPHA);
    linkColor.push(base);

    linkOrg.push(o);
    linkMeta.push({ org: o, kind: k, addr: a, val: v, layer: "Kind → Addressee" });
  }

  // Save for highlighting
  LAST_LINK_ORG = linkOrg.slice();
  LAST_LINK_BASECOLORS = linkColor.slice();
  LAST_LINK_META = linkMeta.slice();
  LAST_LINK_SOURCE = source.slice();
  LAST_LINK_TARGET = target.slice();
  LAST_LINK_LINE_COLORS = Array(linkColor.length).fill('rgba(0,0,0,0.15)');
  LAST_LINK_LINE_WIDTHS = Array(linkColor.length).fill(0.3);
  LAST_NODE_BASECOLORS = nodeColor.slice();
  LAST_NODE_META = labels.map((lab, i) => {
    if (i < orgList.length) return { col: 'org', name: lab };
    if (i < orgList.length + kindList.length) return { col: 'kind', name: lab };
    return { col: 'addr', name: lab };
  });

  const data = [{
    type: "sankey",
    arrangement: "snap",
    node: {
      pad: 22,
      thickness: 16,
      line: { color: "rgba(0,0,0,0)", width: 0.5 },
      label: labels,
      color: nodeColor,
      // so we can detect org nodes on click:
      customdata: LAST_NODE_META
    },
    link: {
      source,
      target,
      value,
      color: linkColor,
      line: { width: 0.3, color: "rgba(0,0,0,0.15)" },
      customdata: linkMeta,
      hovertemplate:
        "<b>%{customdata.layer}</b><br>" +
        "Org: %{customdata.org}<br>" +
        "Kind: %{customdata.kind}<br>" +
        "%{customdata.addr}"+ // will show blank for Org→Kind; fine
        "<extra></extra>"
    }
  }];

  const layout = {
    margin: { l: 20, r: 20, t: 45, b: 45 },
    font: { size: 12, color: "#111827" },
    paper_bgcolor: "#ffffff",
    plot_bgcolor: "#ffffff"
  };

  

  Plotly.newPlot("chart", data, layout, {
    responsive: true,
    scrollZoom: false,
    displayModeBar: true,
    modeBarButtonsToRemove: [
      "zoom2d","pan2d","select2d","lasso2d",
      "zoomIn2d","zoomOut2d","autoScale2d","resetScale2d"
    ]
  }).then(() => {
    const chart = document.getElementById("chart");

    // Avoid stacking multiple handlers on rerender
    chart.removeAllListeners?.("plotly_click");

    chart.on("plotly_click", (ev) => {
      const pt = ev?.points?.[0];
      if (!pt) return;

      // Node click
      if (pt.pointData && pt.pointData.node){
        const nodeIndex = pt.pointNumber;
        if (nodeIndex < orgList.length){
          const clickedOrg = orgList[nodeIndex];
          SELECTED_ORG = (SELECTED_ORG === clickedOrg) ? null : clickedOrg;
          applyHighlight(SELECTED_ORG);
          return;
        }
      }

      // If click elsewhere, do nothing (or you can clear highlight if you want)
    });

    // Rich hover/click interactions for all three node columns
    installSankeyInteractions(chart, orgList, kindList, addrList);
    if (PINNED_FOCUS){
      const stillVisible = LAST_NODE_META.some(m => focusEquals(m, PINNED_FOCUS));
      if (stillVisible){
        applyPathHighlight(PINNED_FOCUS);
      } else {
        PINNED_FOCUS = null;
        SELECTED_ORG = null;
        hideSankeyPanel();
      }
    }

    // Re-apply highlight after rerender if one is selected
    if (SELECTED_ORG){
      // if selected org no longer exists after filter, clear
      if (!orgIdx.has(SELECTED_ORG)) SELECTED_ORG = null;
      applyHighlight(SELECTED_ORG);
    }
  });

  return { orgCount: orgList.length, kindCount: kindList.length, addrCount: addrList.length };
}


/** Load once, then re-render on filters. */
let ALL_ROWS = null;
let SELECTED_ORG = null;
let LAST_LINK_ORG = [];       // per-link org attribution
let LAST_LINK_BASECOLORS = []; // per-link base color (rgba)
 
let ORG_COLOR_MAP = null;
let PINNED_FOCUS = null;
let HOVER_FOCUS = null;
let LAST_VISIBLE_ROWS = [];
let LAST_LINK_META = [];
let LAST_LINK_SOURCE = [];
let LAST_LINK_TARGET = [];
let LAST_LINK_LINE_COLORS = [];
let LAST_LINK_LINE_WIDTHS = [];
let LAST_NODE_BASECOLORS = [];
let LAST_NODE_META = [];

async function loadCSVOnce(){
  setStatus(`Loading CSV: <code>${CSV_PATH}</code>`);
  const res = await fetch(CSV_PATH, { cache: "no-store" });
  if (!res.ok){
    setStatus(`Could not fetch CSV (<code>${CSV_PATH}</code>). If you opened this as <code>file://</code>, it will fail. Use GitHub Pages or a local server.`);
    throw new Error("CSV fetch failed");
  }
  const csvText = await res.text();
  const parsed = Papa.parse(csvText, {
  header: true,
  skipEmptyLines: true,
  delimiter: ";"
});

  ALL_ROWS = (parsed.data || []).filter(r => Object.keys(r).length);
  if (!ALL_ROWS.length){
    setStatus("CSV parsed, but no rows found.");
    throw new Error("No rows");
  }
  const { orgColor } = buildOrgColorMap(ALL_ROWS);
  ORG_COLOR_MAP = orgColor;
}

function rerender(){
  if (!ALL_ROWS || !ORG_COLOR_MAP) return;

  const filtered = ALL_ROWS.filter(rowPassesDomainFilter);

  console.log("Selected domains:", Array.from(selectedDomains));
  console.log("Filtered rows:", filtered.length);
  console.log("Example filtered domains:", filtered.slice(0,5).map(r => r[COL_DOM]));

  const stats = renderSankey(filtered, ORG_COLOR_MAP);

  const selected = Array.from(selectedDomains);
  const selTxt = selected.length ? selected.join(", ") : "(none)";
  setStatus("");
}


(async function boot(){
  // legend first so it’s interactive quickly
  initLegend(() => rerender());

  await loadCSVOnce();
  rerender();
})().catch(err => console.error(err));
