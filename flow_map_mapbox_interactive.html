Attac Deutschland;Frankfurt (Am Main);Germany;https://www.attac.de/;Trade/Economy;;

SOBREVIVENCIA, Amigos de la Tierra Paraguay;Asunción;Paraguay;https://www.sobrevivencia.org.py/;Energy/Climate/Sustainability;Trade/Economy;

DAH Teatar;Belgrade;Serbia;https://en.dahteatarcentar.com/;Migration;Conflict/War;

CREEES. University of Pittsburgh;Pittsburgh;United States of America;https://www.ucis.pitt.edu/crees/;Under discussion;Energy/Climate/Sustainability;`;


    // Parse and build org objects
    const organizations = [];
    const lines = CSV.split(/\n/).filter(Boolean);
    lines.shift();

    lines.forEach(line => {
      const parts = line.split(/;|\t/).map(x => x.trim());
      const [name, rawCity, rawCountry, website, p, s, t] = parts;
      const city = normalize.city(rawCity);
      const country = normalize.country(rawCountry);
      const key = `${city},${country}`;
      const ll = CITY_LL[key];
      if(!ll) return;

      // Originalkategorien fuer das Popup behalten; fuer Filter und Farbe
      // werden die beiden nicht eigenstaendigen Domains unter other gruppiert.
      const cats = [normalize.cat(p), normalize.cat(s), normalize.cat(t)].filter(Boolean);
      const filterCats = Array.from(new Set(
        cats.map(cat => {
          const key = cat.toLowerCase();
          return (key === 'under discussion' || key === 'active citizenship')
            ? 'other'
            : cat;
        })
      ));
      const primary = filterCats[0] || 'other';

      organizations.push({
        name,
        city,
        country,
        latlng: ll,
        website: normalize.url(website),
        categories: cats,
        filterCategories: filterCats,
        primary
      });
    });

    function makeDivIcon(color){
      const div = document.createElement('div');
      div.className = 'marker-dot';
      div.style.background = color;
      return L.divIcon({ className: '', html: div.outerHTML, iconSize: [16,16], iconAnchor: [8,8] });
    }

    const cluster = L.markerClusterGroup({
      spiderfyOnMaxZoom: false,
      zoomToBoundsOnClick: false,
      showCoverageOnHover: false,
      maxClusterRadius: 45,
      spiderfyDistanceMultiplier: 1.2
    });

    cluster.on('clusterclick', function (a) {
      const childMarkers = a.layer.getAllChildMarkers();

  // Checking if all markers inside the cluster have the same coordinates
      const sameCoordinates = childMarkers.every(marker => {
        const markerLatLng = marker.getLatLng();
        const firstLatLng = childMarkers[0].getLatLng();

        return (
          markerLatLng.lat === firstLatLng.lat &&
          markerLatLng.lng === firstLatLng.lng
        );
      });

  // Case 1: several Organizations at the exact same coordinates
  // => do not zoom in any further, but fan out directly
      if (sameCoordinates) {
        map.panTo(a.layer.getLatLng(), {
          animate: true
        });

        setTimeout(function () {
          a.layer.spiderfy();
        }, 250);

        return;
      }

  // Case 2: Cluster contains different coordinates
  // => zoom in with buffer towards the browser edge
      const childBounds = a.layer.getBounds();

      if (map.getZoom() < map.getMaxZoom()) {
        const panel = document.querySelector('.control-panel');
        const panelRect = panel ? panel.getBoundingClientRect() : null;
        const panelWidth = panelRect ? Math.ceil(panelRect.width) : 0;

        // Keep every child location inside the unobstructed map area.
        const clusterRightPadding = panelWidth > 0
          ? panelWidth + 48
          : 120;

        map.fitBounds(childBounds, {
          paddingTopLeft: [120, 120],
          paddingBottomRight: [clusterRightPadding, 120],
          maxZoom: map.getMaxZoom(),
          animate: true
        });
      } else {
        map.panTo(a.layer.getLatLng(), {
          animate: true
        });

        setTimeout(function () {
          a.layer.spiderfy();
        }, 250);
      }
    });

    map.addLayer(cluster);

    function keepOpenPopupClearOfPanel(event){
      const popupEl = event?.popup?.getElement?.();
      const panel = document.querySelector('.control-panel');
      const mapEl = map.getContainer();

      if (!popupEl || !panel || !mapEl) return;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const popupRect = popupEl.getBoundingClientRect();
          const panelRect = panel.getBoundingClientRect();
          const mapRect = mapEl.getBoundingClientRect();
          const gap = 18;

          const leftLimit = mapRect.left + gap;
          const topLimit = mapRect.top + gap;
          const bottomLimit = mapRect.bottom - gap;

          const overlapsPanelVertically =
            popupRect.bottom > panelRect.top - gap &&
            popupRect.top < panelRect.bottom + gap;

          const rightLimit = overlapsPanelVertically
            ? Math.min(mapRect.right - gap, panelRect.left - gap)
            : mapRect.right - gap;

          let shiftX = 0;
          let shiftY = 0;

          if (popupRect.right > rightLimit) {
            shiftX += popupRect.right - rightLimit;
          }

          if (popupRect.left - shiftX < leftLimit) {
            shiftX -= leftLimit - (popupRect.left - shiftX);
          }

          if (popupRect.bottom > bottomLimit) {
            shiftY += popupRect.bottom - bottomLimit;
          }

          if (popupRect.top - shiftY < topLimit) {
            shiftY -= topLimit - (popupRect.top - shiftY);
          }

          if (Math.abs(shiftX) > 1 || Math.abs(shiftY) > 1) {
            map.panBy(
              [shiftX, shiftY],
              { animate: true, duration: 0.25 }
            );
          }
        });
      });
    }

    map.off?.('popupopen', keepOpenPopupClearOfPanel);
    map.on('popupopen', keepOpenPopupClearOfPanel);

    function keepSpiderfiedMarkersClearOfPanel(event){
      const markers = event?.markers || [];
      if (!markers.length) return;

      requestAnimationFrame(() => {
        const panel = document.querySelector('.control-panel');
        const panelRect = panel ? panel.getBoundingClientRect() : null;
        const mapRect = map.getContainer().getBoundingClientRect();

        const leftLimit = mapRect.left + 24;
        const rightLimit = panelRect
          ? Math.min(mapRect.right - 24, panelRect.left - 24)
          : mapRect.right - 24;
        const topLimit = mapRect.top + 24;
        const bottomLimit = mapRect.bottom - 24;

        const points = markers.map(marker =>
          map.latLngToContainerPoint(marker.getLatLng())
        );

        const minX = Math.min(...points.map(p => p.x)) + mapRect.left;
        const maxX = Math.max(...points.map(p => p.x)) + mapRect.left;
        const minY = Math.min(...points.map(p => p.y)) + mapRect.top;
        const maxY = Math.max(...points.map(p => p.y)) + mapRect.top;

        let shiftX = 0;
        let shiftY = 0;

        if (maxX > rightLimit) shiftX += maxX - rightLimit;
        if (minX - shiftX < leftLimit) shiftX -= leftLimit - (minX - shiftX);

        if (maxY > bottomLimit) shiftY += maxY - bottomLimit;
        if (minY - shiftY < topLimit) shiftY -= topLimit - (minY - shiftY);

        if (Math.abs(shiftX) > 1 || Math.abs(shiftY) > 1){
          map.panBy([shiftX, shiftY], { animate: true, duration: 0.25 });
        }
      });
    }

    if (typeof cluster !== 'undefined' && cluster?.on){
      cluster.off?.('spiderfied', keepSpiderfiedMarkersClearOfPanel);
      cluster.on('spiderfied', keepSpiderfiedMarkersClearOfPanel);
    }

    let allMarkers = [];

    /* VALEUS_FLOW_POPUP_HELPERS_START */
    function flowEscapeHtml(value){
      return String(value == null ? '' : value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function flowDetailKey(name, city, country){
      const norm = value => String(value || '').trim().replace(/\s+/g, ' ').toLowerCase();
      return `${norm(name)}||${norm(city)}||${norm(country)}`;
    }

    function flowSafeUrl(value){
      let raw = String(value || '').trim();
      if(!raw) return '';
      if(!/^https?:\/\//i.test(raw)) raw = `https://${raw}`;
      try {
        const u = new URL(raw);
        return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '';
      } catch(e) {
        return '';
      }
    }

    function buildRichOrganizationPopup(o){
      const detail = ORG_DETAILS[flowDetailKey(o.name, o.city, o.country)] || {};
      const orgType = detail.type || '';
      const headquarters = [detail.city || o.city, detail.country || o.country]
        .filter(Boolean).join(', ');
      const website = detail.website || o.website || '';
      const href = flowSafeUrl(website);

      const websiteHtml = website
        ? (href
            ? `<a href="${flowEscapeHtml(href)}" target="_blank" rel="noopener noreferrer">${flowEscapeHtml(website)}</a>`
            : flowEscapeHtml(website))
        : '<em>Not specified</em>';

      const projects = Array.isArray(detail.projects) ? detail.projects : [];

      const projectsHtml = projects.length
        ? projects.map(project => {
            const projectHref = flowSafeUrl(project.website || '');
            const projectLink = projectHref
              ? `<a class="flow-popup-project-link" href="${flowEscapeHtml(projectHref)}" target="_blank" rel="noopener noreferrer" title="Open project website" aria-label="Open project website">↗</a>`
              : '';
            const description = project.description
              ? `<div class="flow-popup-project-description"><strong>Description:</strong> ${flowEscapeHtml(project.description)}</div>`
              : '';
            const temporalType = project.temporalType
              ? `<div class="flow-popup-line"><strong>Project/Action temporal type:</strong> ${flowEscapeHtml(project.temporalType)}</div>`
              : '';
            const timeOfOperation = project.timeOfOperation
              ? `<div class="flow-popup-line"><strong>Time of operation:</strong> ${flowEscapeHtml(project.timeOfOperation)}</div>`
              : '';
            const countries = project.countries
              ? `<div class="flow-popup-line"><strong>Countries of engagement:</strong> ${flowEscapeHtml(project.countries)}</div>`
              : '';
            const domains = project.actionDomains
              ? `<div class="flow-popup-line"><strong>Action domain:</strong> ${flowEscapeHtml(project.actionDomains)}</div>`
              : '';
            const kinds = project.kindsOfAction
              ? `<div class="flow-popup-line"><strong>Kind of action:</strong> ${flowEscapeHtml(project.kindsOfAction)}</div>`
              : '';

            return `
              <div class="flow-popup-project">
                <div class="flow-popup-project-title">${flowEscapeHtml(project.name || 'Untitled project')}${projectLink}</div>
                ${description}
                ${temporalType}
                ${timeOfOperation}
                ${countries}
                ${domains}
                ${kinds}
              </div>`;
          }).join('')
        : `<div class="flow-popup-line"><em>No project information is available for this organisation.</em></div>`;

      const fallbackDomains = (!projects.length && o.categories && o.categories.length)
        ? `<div class="flow-popup-line"><strong>Action domains:</strong> ${flowEscapeHtml(o.categories.join(', '))}</div>`
        : '';

      return `
        <div class="flow-popup">
          <div class="flow-popup-type">Organization</div>
          <div class="flow-popup-title">${flowEscapeHtml(o.name)}</div>

          <div class="flow-popup-section">
            <div class="flow-popup-label">Description</div>
            <div class="flow-popup-line"><strong>Type:</strong> ${orgType ? flowEscapeHtml(orgType) : '<em>Not specified</em>'}</div>
            <div class="flow-popup-line"><strong>Headquarters:</strong> ${flowEscapeHtml(headquarters)}</div>
            <div class="flow-popup-line"><strong>Website:</strong> ${websiteHtml}</div>
          </div>

          <div class="flow-popup-section">
            <div class="flow-popup-label">Projects</div>
            ${projectsHtml}
            ${fallbackDomains}
          </div>
        </div>`;
    }
    /* VALEUS_FLOW_POPUP_HELPERS_END */

    function render(data){
      cluster.clearLayers();

      allMarkers = data.map(o => {
        const icon = makeDivIcon(CAT_COLORS[o.primary] || CAT_COLORS['other']);
        const m = L.marker(o.latlng, { icon });
        m.bindTooltip(o.name);

        m.bindPopup(
          buildRichOrganizationPopup(o),
          {
            maxWidth: 460,
            minWidth: 320,
            autoPan: true,
            keepInView: true
          }
        );

        m.__data = o;
        return m;
      });

      cluster.addLayers(allMarkers);
      fitAll();
    }

    const legendEl = document.getElementById('legend');
    const ALL_CATS = Array.from(new Set(
      organizations.flatMap(o =>
        o.filterCategories.length ? o.filterCategories : ['other']
      )
    )).sort();

    ALL_CATS.forEach(cat => {
      const li = document.createElement('li');
      li.className = 'legend-item';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      cb.dataset.cat = cat;
      cb.addEventListener('change', applyFilters);

      const sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = CAT_COLORS[cat] || CAT_COLORS['other'];

      const label = document.createElement('span');
      label.textContent = ' ' + cat;

      li.appendChild(sw);
      li.prepend(cb);
      li.appendChild(label);
      legendEl.appendChild(li);
    });

    document.getElementById('search').addEventListener('input', applyFilters);

    function applyFilters(){
      const q = document.getElementById('search').value.trim().toLowerCase();
      const activeCats = Array.from(document.querySelectorAll('#legend input[type="checkbox"]:checked'))
        .map(x => x.dataset.cat);

      const filtered = organizations.filter(o =>
        (!q || o.name.toLowerCase().includes(q)) &&
        (o.filterCategories.length
          ? o.filterCategories.some(c => activeCats.includes(c))
          : activeCats.includes('other'))
      );

      render(filtered);
    }

    function fitAll(){
      if(!allMarkers.length) return;

      const fg = L.featureGroup(allMarkers);

      requestAnimationFrame(() => {
        const panel = document.querySelector('.control-panel');
        const panelRect = panel ? panel.getBoundingClientRect() : null;
        const panelWidth = panelRect ? Math.ceil(panelRect.width) : 0;

        // Panel is on the RIGHT: reserve that space when fitting markers.
        const rightPadding = panelWidth > 0 ? panelWidth + 36 : 36;

        try {
          map.invalidateSize(false);
          map.fitBounds(
            fg.getBounds(),
            {
              paddingTopLeft: [36, 36],
              paddingBottomRight: [rightPadding, 36],
              maxZoom: 12,
              animate: false
            }
          );
        } catch(e) {}
      });
    }

    const FitControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function(){
        const div = L.DomUtil.create('div', 'leaflet-control custom-fit');
        const btn = L.DomUtil.create('button', 'fit-btn', div);
        btn.type = 'button';
        btn.title = 'Zoom to show all organizations';
        btn.innerHTML = '⤢ Show all';
        L.DomEvent.on(btn, 'click', (e) => {
          L.DomEvent.stop(e);
          fitAll();
        });
        return div;
      }
    });

    map.addControl(new FitControl());

    render(organizations);

    const panel = document.querySelector('.control-panel');
    const toggleBtn = document.getElementById('toggle-panel');
    let collapsed = false;

    toggleBtn.addEventListener('click', () => {
      collapsed = !collapsed;

      if (collapsed) {
        panel.style.height = '40px';
        panel.style.overflow = 'hidden';
        toggleBtn.textContent = '+';
      } else {
        panel.style.height = '';
        panel.style.overflow = 'auto';
        toggleBtn.textContent = '−';
      }

      setTimeout(fitAll, 50);
    });
  </script>
